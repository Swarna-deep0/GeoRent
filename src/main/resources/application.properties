spring.application.name=OnlyRooms

server.port=8081

# MongoDB Configuration
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/georent}

# JWT Configuration
georent.jwt.secret=${ONLYROOMS_JWT_SECRET}
georent.jwt.expiration=3600

# Document Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Local Document Storage
georent.document.upload-dir=${ONLYROOMS_UPLOAD_DIR:./georent-uploads}

# Initial ADMIN Bootstrap
onlyrooms.admin.bootstrap.enabled=${ONLYROOMS_ADMIN_BOOTSTRAP_ENABLED:false}
onlyrooms.admin.bootstrap.full-name=${ONLYROOMS_ADMIN_NAME:}
onlyrooms.admin.bootstrap.email=${ONLYROOMS_ADMIN_EMAIL:}
onlyrooms.admin.bootstrap.phone=${ONLYROOMS_ADMIN_PHONE:}
onlyrooms.admin.bootstrap.password=${ONLYROOMS_ADMIN_PASSWORD:}